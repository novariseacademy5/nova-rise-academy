<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Nova Rise Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #eef6ff, #ffffff);
  color: #172033;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

/* LOGIN */

.login-box {
  width: 100%;
  max-width: 430px;
  margin: 60px auto;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
  text-align: center;
  color: #1677ff;
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 25px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: 600;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d6dce5;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #1677ff;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.login-btn {
  width: 100%;
  margin-top: 20px;
  background: #1677ff;
  color: white;
}

.login-btn:hover {
  background: #075dcc;
}

.login-btn:disabled {
  background: #9bbff0;
  cursor: not-allowed;
}

/* ADMIN */

#adminPanel {
  display: none;
}

.header {
  background: white;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.header h1 {
  color: #1677ff;
  margin-bottom: 5px;
}

.header p {
  color: #667085;
}

.logout {
  background: #c62828;
  color: white;
}

.logout:hover {
  background: #a51f1f;
}

.message {
  display: none;
  padding: 13px;
  border-radius: 10px;
  margin-bottom: 15px;
  text-align: center;
  font-size: 14px;
}

.success {
  display: block;
  background: #e7f8ee;
  color: #087443;
}

.error {
  display: block;
  background: #ffe8e8;
  color: #b42318;
}

.loading {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 15px;
  color: #667085;
}

.payment {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.payment h3 {
  color: #1677ff;
  margin-bottom: 15px;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px solid #edf0f4;
}

.label {
  font-weight: 700;
}

.screenshot {
  display: block;
  max-width: 350px;
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.approve {
  background: #16834a;
  color: white;
  flex: 1;
}

.reject {
  background: #c62828;
  color: white;
  flex: 1;
}

.approve:hover {
  background: #106b3c;
}

.reject:hover {
  background: #a51f1f;
}

.empty {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 15px;
  color: #667085;
}

.small-note {
  margin-top: 12px;
  color: #667085;
  font-size: 12px;
  text-align: center;
}

@media(max-width:600px) {

  body {
    padding: 12px;
  }

  .header-top {
    flex-direction: column;
    align-items: stretch;
  }

  .logout {
    width: 100%;
  }

  .row {
    flex-direction: column;
    gap: 4px;
  }

  .buttons {
    flex-direction: column;
  }

  .buttons button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ================= LOGIN ================= -->

  <div id="loginBox" class="login-box">

    <div class="logo">
      NOVA RISE ACADEMY
    </div>

    <div class="subtitle">
      Secure Admin Panel
    </div>

    <h2>Admin Login</h2>

    <form id="adminLoginForm">

      <label>Admin Email</label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Enter admin email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="adminPassword"
        placeholder="Enter admin password"
        required
      >

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login as Admin
      </button>

      <div id="loginMessage" class="message"></div>

    </form>

    <div class="small-note">
      Only authorized admin accounts can access this panel.
    </div>

  </div>


  <!-- ================= ADMIN PANEL ================= -->

  <div id="adminPanel">

    <div class="header">

      <div class="header-top">

        <div>
          <h1>NOVA RISE ACADEMY</h1>
          <p>Admin Payment Verification Panel</p>
        </div>

        <button
          class="logout"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>

    </div>

    <div id="adminMessage" class="message"></div>

    <div id="payments">

      <div class="loading">
        Loading payment requests...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
  "https://scdkjcckoxerwjsvjxxu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_w3RCkBMXOYEQ7vhe7fKB0A_E3V1KDEi";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const loginForm =
  document.getElementById("adminLoginForm");

const loginBtn =
  document.getElementById("loginBtn");

const loginMessage =
  document.getElementById("loginMessage");

const adminMessage =
  document.getElementById("adminMessage");

const paymentsBox =
  document.getElementById("payments");

const logoutBtn =
  document.getElementById("logoutBtn");


/* =====================================================
   MESSAGE FUNCTIONS
   ===================================================== */

function showLoginMessage(text, type) {

  loginMessage.textContent = text;

  loginMessage.className =
    "message " + type;

  loginMessage.style.display = "block";
}


function showAdminMessage(text, type) {

  adminMessage.textContent = text;

  adminMessage.className =
    "message " + type;

  adminMessage.style.display = "block";
}


/* =====================================================
   CHECK ADMIN ROLE
   ===================================================== */

async function checkAdmin(userId) {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", userId)
    .single();


  if (error) {

    console.error("Profile error:", error);

    throw new Error(
      "Admin profile could not be verified."
    );
  }


  if (!data || data.role !== "admin") {

    throw new Error(
      "This account is not authorized as an admin."
    );
  }


  return true;
}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginMessage.style.display = "none";

    const email =
      document.getElementById("adminEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
      document.getElementById("adminPassword")
        .value;


    loginBtn.disabled = true;
    loginBtn.textContent = "Checking...";


    try {

      /* SIGN IN */

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {
        throw error;
      }


      if (!data.user) {

        throw new Error(
          "Login could not be completed."
        );
      }


      /* CHECK ADMIN ROLE */

      await checkAdmin(data.user.id);


      /* SUCCESS */

      loginBox.style.display = "none";

      adminPanel.style.display = "block";

      await loadPayments();


    } catch (error) {

      console.error(error);

      await supabaseClient.auth.signOut();


      let errorText =
        error.message ||
        "Admin login failed.";


      showLoginMessage(
        errorText,
        "error"
      );


      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login as Admin";
    }

  }
);


/* =====================================================
   LOAD PAYMENT REQUESTS
   ===================================================== */

async function loadPayments() {

  paymentsBox.innerHTML =
    '<div class="loading">Loading payment requests...</div>';


  try {

    const {
      data: { user },
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError || !user) {

      throw new Error(
        "Admin session not found."
      );
    }


    /* CHECK ADMIN AGAIN */

    await checkAdmin(user.id);


    /* GET PENDING PAYMENTS */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("payments")
        .select("*")
        .eq("status", "pending")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Payment query error:",
        error
      );

      throw new Error(
        "Payment requests could not be loaded. Please check your database RLS policies."
      );
    }


    if (!data || data.length === 0) {

      paymentsBox.innerHTML =
        '<div class="empty">No pending payment requests.</div>';

      return;
    }


    paymentsBox.innerHTML = "";


    data.forEach(function(payment) {

      const card =
        document.createElement("div");

      card.className = "payment";


      const plan =
        payment.membership_plan ||
        "N/A";


      const amount =
        payment.amount || 0;


      let screenshotHTML =
        '<p style="margin-top:12px;color:#667085;">No payment screenshot available.</p>';


      if (payment.screenshot_path) {

        const {
          data: publicData
        } =
          supabaseClient
            .storage
            .from("payment-screenshots")
            .getPublicUrl(
              payment.screenshot_path
            );


        if (
          publicData &&
          publicData.publicUrl
        ) {

          screenshotHTML = `
            <img
              src="${publicData.publicUrl}"
              class="screenshot"
              alt="Payment Screenshot"
            >
          `;
        }
      }


      card.innerHTML = `

        <h3>Payment Request</h3>

        <div class="row">
          <span class="label">User ID</span>
          <span>${payment.user_id || "N/A"}</span>
        </div>

        <div class="row">
          <span class="label">Membership</span>
          <span>${plan}</span>
        </div>

        <div class="row">
          <span class="label">Amount</span>
          <span>₹${amount}</span>
        </div>

        <div class="row">
          <span class="label">UTR</span>
          <span>${payment.utr || "N/A"}</span>
        </div>

        <div class="row">
          <span class="label">Status</span>
          <span>${payment.status || "pending"}</span>
        </div>

        ${screenshotHTML}

        <div class="buttons">

          <button
            class="approve"
            onclick="updatePayment('${payment.id}', 'approved')"
          >
            APPROVE
          </button>

          <button
            class="reject"
            onclick="updatePayment('${payment.id}', 'rejected')"
          >
            REJECT
          </button>

        </div>

      `;


      paymentsBox.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    paymentsBox.innerHTML =
      '<div class="empty">' +
      error.message +
      '</div>';
  }
}


/* =====================================================
   APPROVE / REJECT PAYMENT
   ===================================================== */

async function updatePayment(
  id,
  newStatus
) {

  const confirmAction =
    confirm(
      "Are you sure you want to " +
      newStatus.toUpperCase() +
      " this payment?"
    );


  if (!confirmAction) {
    return;
  }


  try {

    /* CHECK CURRENT ADMIN */

    const {
      data: { user },
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError || !user) {

      throw new Error(
        "Admin session expired. Please login again."
      );
    }


    await checkAdmin(user.id);


    /* UPDATE PAYMENT */

    const {
      error
    } =
      await supabaseClient
        .from("payments")
        .update({
          status: newStatus
        })
        .eq("id", id);


    if (error) {

      console.error(error);

      throw new Error(
        "Payment update failed: " +
        error.message
      );
    }


    showAdminMessage(
      "Payment " +
      newStatus +
      " successfully.",
      "success"
    );


    await loadPayments();


  } catch (error) {

    console.error(error);

    showAdminMessage(
      error.message ||
      "Payment update failed.",
      "error"
    );
  }
}


/* =====================================================
   LOGOUT
   ===================================================== */

logoutBtn.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    adminPanel.style.display = "none";

    loginBox.style.display = "block";

    loginForm.reset();

    paymentsBox.innerHTML =
      '<div class="loading">Login to view payment requests.</div>';

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login as Admin";
  }
);


/* =====================================================
   INITIAL SESSION CHECK
   ===================================================== */

async function checkExistingSession() {

  try {

    const {
      data: { user }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {
      return;
    }


    await checkAdmin(user.id);


    loginBox.style.display = "none";

    adminPanel.style.display = "block";

    await loadPayments();


  } catch (error) {

    console.log(
      "No valid admin session."
    );

    await supabaseClient.auth.signOut();

    loginBox.style.display = "block";

    adminPanel.style.display = "none";
  }
}


checkExistingSession();

</script>

</body>
</html>
