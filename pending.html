<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Verification - Nova Rise Academy</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef6ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      color: #1677ff;
      margin-bottom: 12px;
    }

    p {
      color: #667085;
      line-height: 1.6;
    }

    .status {
      margin: 25px 0;
      padding: 15px;
      background: #fff7df;
      color: #8a6100;
      border-radius: 12px;
      font-weight: 700;
    }

    .btn {
      display: block;
      text-decoration: none;
      background: #1677ff;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">⏳</div>

    <h1>Registration Successful</h1>

    <p>
      Your account has been created successfully.
    </p>

    <div class="status">
      Payment Verification Pending
    </div>

    <p>
      Next step: complete your membership payment and submit
      your payment screenshot for verification.
    </p>

    <a href="login.html" class="btn">
      Go to Login
    </a>

  </div>

</body>
</html>
